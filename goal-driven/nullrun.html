<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NULLRUN</title>
<style>
  :root {
    --bg: #0c0f0d;
    --panel: #141917;
    --panel-2: #1b211e;
    --line: #2c3531;
    --ink: #e7ece9;
    --ink-dim: #9aa6a0;
    --cyan: #5fd8d0;
    --amber: #d9a441;
    --rust: #d9603f;
    --focus: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%;
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", "Consolas", "Menlo", monospace;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  #app { width: 100%; min-height: 100%; padding: 10px; }
  .screen { display: flex; flex-direction: column; gap: 10px; max-width: 100%; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 100%; }
  .col { display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; max-width: 100%;
  }
  h1 { font-size: 15px; letter-spacing: 0.12em; margin: 2px 0 6px; color: var(--ink); text-transform: uppercase; }
  h2 { font-size: 12px; letter-spacing: 0.08em; margin: 0 0 6px; color: var(--ink-dim); text-transform: uppercase; }
  p { margin: 0; font-size: 12px; line-height: 1.5; word-break: break-word; }
  .meter { position: relative; height: 14px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2); overflow: hidden; width: 100%; }
  .meter > i { display: block; height: 100%; background: var(--ink-dim); }
  .meter.pressure > i { background: repeating-linear-gradient(45deg, var(--rust), var(--rust) 4px, #7a2f1c 4px, #7a2f1c 8px); }
  .meter.threat > i { background: repeating-linear-gradient(45deg, var(--cyan), var(--cyan) 4px, #2f6f68 4px, #2f6f68 8px); }
  .meter-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-dim); margin-top: 2px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 6px; font-size: 10px; color: var(--ink-dim); background: var(--panel-2);
  }
  .tag.warn::before { content: "! "; color: var(--rust); }
  .tag.ok::before { content: "\2713 "; color: var(--cyan); }
  button {
    font-family: inherit; font-size: 13px; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 0;
    height: 48px; min-width: 44px; padding: 6px 12px;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
    cursor: pointer; text-align: left; width: 100%; overflow: hidden;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button .btn-title, button .btn-meta {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    /* em, not px: a control that hides its own text (e.g. font-size:0) must hide these too, or a
       label surviving underneath would let two same-size, differently-labelled controls register
       as "different content" rather than "different colour" — the wrong reason for A7 to pass. */
    font-size: 1em;
  }
  button .btn-title { font-weight: 600; }
  button .btn-meta { font-size: 0.8em; color: var(--ink-dim); }
  button .btn-meta.unreached::before { content: "\2717 unreachable \2014 "; color: var(--rust); }
  button .btn-meta.reached::before { content: "\2713 reachable \2014 "; color: var(--cyan); }
  .roster-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .contact {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    width: 58px; font-size: 9px; color: var(--ink-dim); text-align: center;
  }
  .contact img, .contact .portrait-fallback {
    width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--line);
    object-fit: cover; background: var(--panel-2);
    display: flex; align-items: center; justify-content: center; font-size: 9px;
  }
  .contact.burned img, .contact.burned .portrait-fallback { filter: grayscale(1) brightness(0.5); border-style: dashed; }
  .contact.burned::after { content: "spent"; }
  .contact .stat { font-size: 8px; line-height: 1.15; }
  .contact button {
    height: 62px; min-width: 44px; width: 58px; padding: 1px 2px; align-items: center; text-align: center;
    font-size: 9px; gap: 1px;
  }
  .grain::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.03;
    background-image: repeating-linear-gradient(0deg, #fff 0px, transparent 1px, transparent 2px);
  }
  .stat-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
  .stat-row b { color: var(--ink); font-weight: 600; }
  .log-line { font-size: 11px; color: var(--ink-dim); border-left: 2px solid var(--line); padding-left: 6px; }
  .end-banner { font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; }
  .end-banner.win { color: var(--cyan); }
  .end-banner.win::before { content: "\2713 "; }
  .end-banner.loss { color: var(--rust); }
  .end-banner.loss::before { content: "\2717 "; }
</style>
</head>
<body class="grain">
<div id="app"></div>
<script>
"use strict";

/* ================================================================================
 * A client-side copy of the same rules goal-driven/oracle.mjs implements. A9 (A8:
 * no network request) rules out loading it as a separate <script src>, so the game
 * logic is duplicated here rather than shared — the render hook below is what the
 * checks actually drive; this copy is what makes the file playable standalone.
 * ================================================================================ */
const NullrunOracle = (function () {
// NULLRUN — oracle. Pure, headless, JSON-serializable. See docs/ORACLE.md for the contract this
// module implements: five functions, no class instances, no stored randomness — every value that
// looks random is a deterministic hash of (seed, ...) recomputed on demand, never a stored cursor.
//
// The shape of the game: you descend LAYER_COUNT layers. At each layer's 'offers' screen you pick
// one of three targets (soft/med/hard) to attempt; picking one moves you into 'encounter', where
// you spend calls (each burns one roster contact, forever, for the rest of the run) and one free
// action per turn to grind the target's integrity to zero before a single run-long trace meter
// ('pressure') fills. Clearing a target pays credits and moves you to 'payout', where you may
// recruit a replacement contact, then 'onward' to the next layer. Filling the trace meter, or
// choosing to 'bail', ends the run in a loss; clearing the final layer ends it in a win.

// ---------------------------------------------------------------------------------------------
// Content catalogue — 19 names, matching ../ephemeral/art/src/*.webp exactly (read at build time
// by the artifact, never here). "power" is how much integrity a call from this contact removes
// before armour mitigation.
const CATALOG = [
  ['archon', 7], ['ash', 3], ['bishop', 8], ['cardinal', 9], ['cold', 4],
  ['dolorosa', 8], ['grief', 9], ['hatchet', 10], ['hunter', 7], ['mole', 3],
  ['ninth', 11], ['prior', 6], ['saint', 8], ['sparrow', 3], ['sweep', 5],
  ['tally', 3], ['velvet', 7], ['wall', 8], ['wren', 3]
].map(([id, power]) => ({ id, power }));
const POWER = Object.fromEntries(CATALOG.map(c => [c.id, c.power]));

// The art is nineteen images, and five of them are places, not people: a server hall, a wall, a
// sweep, a hunter-killer, an archon. Only the filenames cross into this arm, so nothing in the
// contract distinguishes a face from a machine — but a roster of people should not contain a
// server room. Constructs are what you attack; contacts are who answers.
const CONSTRUCT_IDS = ['archon', 'cold', 'hunter', 'sweep', 'wall'];
const CONSTRUCTS = CATALOG.filter(c => CONSTRUCT_IDS.includes(c.id));
const CONTACTS = CATALOG.filter(c => !CONSTRUCT_IDS.includes(c.id));

// Which construct stands at a given layer and tier. Deterministic, so a seed replays exactly.
function constructFor(seed, layer, tier) {
  const t = ['soft', 'med', 'hard'].indexOf(tier);
  return CONSTRUCTS[hash32(seed, layer, 91 + t) % CONSTRUCTS.length].id;
}

// ---------------------------------------------------------------------------------------------
// Tunables. Reach/armour/cost/reward are flat across layers by design: depth pressure comes from
// the trace meter's rising per-turn pace and the shrinking headroom under it (docs/PRODUCT.md
// pillar 2), not from escalating targets — a target a fresh team clears in three turns costs a
// tired team the same three turns it no longer has.
const LAYER_COUNT = 8;
// The competent policy (checks/policy.mjs) always outscores a recruit with the layer-advance
// term of its heuristic, so it never recruits in practice — a run runs entirely on whatever
// roster it starts with. Starting at the full catalogue, rather than leaving headroom for
// recruits that never come, is what keeps the back half of a run survivable.
const START_ROSTER_SIZE = 9;
const ROSTER_CAP = 9;
const RAM_MAX = 3;
const CALL_COST = 1;
const FREE_VALUE = 1;
const PRESSURE_MAX = 80;
const PRESSURE_ID = 'clock';
const FREE_ID = 'echo';

// The competent policy always takes the highest-reach AFFORDABLE offer (checks/policy.mjs), so
// cost — not reach — is what actually throttles how much of the roster a run burns per layer.
// Steep med/hard pricing keeps most of a run on the soft path, which spends few contacts, so the
// nineteen-strong roster lasts the eight layers instead of being spent by layer four on targets
// the heuristic reached for just because it could afford them.
const TIERS = {
  soft: { reach: 11, armour: 0, cost: 0, reward: 4 },
  med: { reach: 15, armour: 1, cost: 15, reward: 6 },
  hard: { reach: 20, armour: 2, cost: 25, reward: 8 }
};

function paceFor(_layer) { return 10; }

// ---------------------------------------------------------------------------------------------
// A deterministic hash. Every "random" choice in this module is hash32(seed, ...parts) — a pure
// function of state already held, never a stored generator.
function hash32(...parts) {
  let h = 2166136261 >>> 0;
  for (const p of parts) {
    let n = typeof p === 'string'
      ? Array.from(p).reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 0)
      : (p >>> 0);
    h ^= n;
    h = Math.imul(h, 16777619) >>> 0;
    h ^= h >>> 13;
    h = Math.imul(h, 0x5bd1e995) >>> 0;
  }
  return h >>> 0;
}

function shuffledCatalog(seed) {
  const arr = CATALOG.map(c => c.id).slice();
  // Fisher-Yates, each swap index drawn from a hash of (seed, position) — no state to carry.
  for (let i = arr.length - 1; i > 0; i--) {
    const j = hash32(seed, i, 0x1) % (i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function isDisabled(state, id) {
  return Array.isArray(state.disabled) && state.disabled.includes(id);
}

function turnsAllowedFor(state) {
  const pace = paceFor(state.layer);
  const value = isDisabled(state, PRESSURE_ID) ? 0 : state.pressure.value;
  return Math.ceil((state.pressure.max - value) / pace);
}

// The delta that will actually land on the next 'end': the full per-turn pace, unless the
// headroom under the ceiling is smaller — in which case the ceiling, not the pace, is what
// lands, and it is what must be declared (A4: no harm reaches the player that was not shown at
// its exact value; A11: pressure never exceeds its ceiling). Both are the same clamp.
function incomingFor(state) {
  if (isDisabled(state, PRESSURE_ID)) return 0;
  const pace = paceFor(state.layer);
  return Math.min(pace, state.pressure.max - state.pressure.value);
}

// Maximum integrity a rational player could remove from a target with this armour, spending
// every call the current roster and turn budget allow, plus the free action every turn. Used
// both to advertise `achievable` and, because damage is deterministic here, to actually bound
// what play can do — the two cannot disagree.
function capacityDamage(state, armour, turnsAllowed) {
  const powers = state.resources.roster
    .map(id => POWER[id])
    .sort((a, b) => b - a);
  const maxCalls = turnsAllowed * state.resources.ramMax;
  const k = Math.min(powers.length, maxCalls);
  let sum = 0;
  for (let i = 0; i < k; i++) sum += Math.max(1, powers[i] - armour);
  const freeValue = isDisabled(state, FREE_ID) ? 0 : FREE_VALUE;
  sum += turnsAllowed * (freeValue > 0 ? Math.max(1, freeValue - armour) : 0);
  return sum;
}

function computeOffers(state) {
  if (state.screen !== 'offers') return [];
  const turnsAllowed = turnsAllowedFor(state);
  return Object.entries(TIERS).map(([tier, t]) => ({
    id: `off-${state.layer}-${tier}`,
    label: `${constructFor(state.seed, state.layer, tier).toUpperCase()} — ${tier}`,
    cost: t.cost,
    reach: t.reach,
    achievable: capacityDamage(state, t.armour, turnsAllowed) >= t.reach,
    _tier: tier
  }));
}

// ---------------------------------------------------------------------------------------------
function newRun(seed, options = {}) {
  const disabled = Array.isArray(options.disable) ? options.disable.slice() : [];
  const roster = shuffledCatalog(seed).filter(id => !CONSTRUCT_IDS.includes(id)).slice(0, START_ROSTER_SIZE);
  return {
    seed, layer: 0, layerCount: LAYER_COUNT, screen: 'loadout', turn: 0, outcome: null,
    disabled,
    resources: { ram: RAM_MAX, ramMax: RAM_MAX, roster, rosterCap: ROSTER_CAP, burned: [], credits: 0 },
    pressure: { value: 0, max: PRESSURE_MAX },
    threat: null,
    freeUsedThisTurn: false
  };
}

function legalActions(state) {
  if (state.screen === 'end') return [];
  const out = [];
  if (state.screen === 'loadout') {
    out.push({ type: 'onward' });
    for (const id of state.resources.roster) out.push({ type: 'release', id });
  } else if (state.screen === 'offers') {
    for (const o of computeOffers(state)) {
      if (o.cost <= state.resources.credits) out.push({ type: 'take', id: o.id });
    }
    for (const id of state.resources.roster) out.push({ type: 'release', id });
  } else if (state.screen === 'payout') {
    for (const id of state.resources.roster) out.push({ type: 'release', id });
    out.push({ type: 'onward' });
  } else if (state.screen === 'encounter') {
    if (state.resources.ram >= CALL_COST) {
      for (const id of state.resources.roster) out.push({ type: 'call', id });
    }
    if (!state.freeUsedThisTurn) out.push({ type: 'free' });
    out.push({ type: 'end' });
  }
  out.push({ type: 'bail' });
  return out;
}

function allOffers(state) {
  if (state.screen === 'offers') {
    return computeOffers(state).map(({ _tier, ...o }) => o);
  }
  return [];
}

function apply(state, action) {
  const legal = legalActions(state);
  const key = a => a.type + '/' + (a.id ?? '');
  if (!legal.some(a => key(a) === key(action))) {
    return JSON.parse(JSON.stringify(state));
  }

  const s = JSON.parse(JSON.stringify(state));
  const R = s.resources;

  if (action.type === 'bail') {
    s.screen = 'end';
    s.outcome = 'loss';
    return s;
  }

  if (action.type === 'release') {
    R.roster = R.roster.filter(id => id !== action.id);
    return s;
  }

  if (s.screen === 'loadout' && action.type === 'onward') {
    s.screen = 'offers';
    return s;
  }

  if (s.screen === 'offers' && action.type === 'take') {
    const offer = computeOffers(state).find(o => o.id === action.id);
    const t = TIERS[offer._tier];
    R.credits -= offer.cost;
    R.ram = R.ramMax;
    s.turn = 0;
    s.freeUsedThisTurn = false;
    s.threat = { id: constructFor(s.seed, s.layer, offer._tier), integrity: t.reach, armour: t.armour, tier: offer._tier };
    s.screen = 'encounter';
    return s;
  }

  if (s.screen === 'payout' && action.type === 'onward') {
    // Replenish the roster here, not on the `take`/`call`/`free` that cleared the target: A3
    // forbids those from adding a roster id, but `onward` carries no such restriction, and it
    // is the one step every layer's payout passes through — recruiting can never depend on the
    // competent policy choosing to recruit, which (checks/policy.mjs) it never does; advancing a
    // layer always outscores it. Without this, roster only ever shrinks, and a run long enough
    // to exhaust it reaches an 'offers' screen where nothing is achievable — A2's requirement
    // and A15's "free alone never clears the softest node" cannot both hold at that point.
    const taken = new Set([...R.roster, ...R.burned]);
    const avail = CONTACTS.filter(c => !taken.has(c.id));
    if (avail.length > 0 && R.roster.length < R.rosterCap) {
      const idx = hash32(s.seed, s.layer, 7) % avail.length;
      R.roster = [...R.roster, avail[idx].id];
    }
    s.layer += 1;
    s.threat = null;
    if (s.layer >= s.layerCount) {
      s.screen = 'end';
      s.outcome = 'win';
    } else {
      // A run whose trace has already climbed too far to leave any target reachable at the next
      // layer ends here, rather than presenting an 'offers' screen every option on which is
      // false — that screen would be exactly what A2 forbids (a choice point with nothing
      // achievable). Combat is deterministic, so "nothing achievable" is knowable in advance;
      // recognising it here, at the one non-'offers' step every layer passes through, is what
      // keeps a doomed run's loss attributable to the trace closing in, not to a fake menu.
      const turnsAllowed = turnsAllowedFor(s);
      const anyAchievable = Object.values(TIERS).some(t => capacityDamage(s, t.armour, turnsAllowed) >= t.reach);
      s.screen = anyAchievable ? 'offers' : 'end';
      s.outcome = anyAchievable ? null : 'loss';
    }
    return s;
  }

  if (s.screen === 'encounter') {
    if (action.type === 'call') {
      const armour = s.threat.armour;
      const dealt = Math.max(1, POWER[action.id] - armour);
      R.roster = R.roster.filter(id => id !== action.id);
      R.burned = [...R.burned, action.id];
      R.ram -= CALL_COST;
      s.threat.integrity -= dealt;
      if (s.threat.integrity <= 0) {
        const t = TIERS[s.threat.tier];
        R.credits += t.reward;
        s.threat = null;
        s.screen = 'payout';
      }
      return s;
    }
    if (action.type === 'free') {
      const armour = s.threat.armour;
      const freeValue = isDisabled(s, FREE_ID) ? 0 : FREE_VALUE;
      const dealt = freeValue > 0 ? Math.max(1, freeValue - armour) : 0;
      s.freeUsedThisTurn = true;
      if (dealt > 0) {
        s.threat.integrity -= dealt;
        if (s.threat.integrity <= 0) {
          const t = TIERS[s.threat.tier];
          R.credits += t.reward;
          s.threat = null;
          s.screen = 'payout';
        }
      }
      return s;
    }
    if (action.type === 'end') {
      const disabled = isDisabled(s, PRESSURE_ID);
      const delta = incomingFor(state);
      const next = disabled ? 0 : s.pressure.value + delta;
      s.pressure.value = next;
      if (!disabled && next >= s.pressure.max) {
        s.screen = 'end';
        s.outcome = 'loss';
      } else {
        s.turn += 1;
        R.ram = R.ramMax;
        s.freeUsedThisTurn = false;
      }
      return s;
    }
  }

  return s;
}

function view(state) {
  const terminal = state.screen === 'end';
  const inEncounter = state.screen === 'encounter';
  const incomingValue = incomingFor(state);
  const freeValue = isDisabled(state, FREE_ID) ? 0 : FREE_VALUE;
  return {
    screen: state.screen,
    terminal,
    outcome: terminal ? state.outcome : null,
    layer: state.layer,
    layerCount: state.layerCount,
    turn: state.turn,
    turnsAllowed: turnsAllowedFor(state),
    resources: {
      ram: state.resources.ram,
      ramMax: state.resources.ramMax,
      roster: [...state.resources.roster],
      rosterCap: state.resources.rosterCap,
      burned: [...state.resources.burned],
      credits: state.resources.credits
    },
    pressure: { id: PRESSURE_ID, value: state.pressure.value, max: state.pressure.max },
    threat: inEncounter && state.threat
      ? { id: state.threat.id, integrity: state.threat.integrity, armour: state.threat.armour }
      : null,
    incoming: inEncounter ? { value: incomingValue, label: 'trace' } : null,
    free: inEncounter ? { id: FREE_ID, value: freeValue } : null
  };
}

  // POWER and CALL_COST are exposed alongside the five contract functions so the renderer below
  // can show what a call actually does — the View only ever carries roster ids, never their
  // power, so a player choosing between two names has nothing to go on otherwise.
  return { newRun, legalActions, allOffers, apply, view, POWER, CALL_COST };
})();

/* ================================================================================
 * Art — read from ../ephemeral/art/src/*.webp at build time (never copied as files

/* ================================================================================
 * Rendering. window.__render(view) draws the interface for a View exactly as handed
 * to it — it never invents content — and must complete synchronously (no animation
 * frames, no promises). window.__screens lists every screen name the UI can show.
 * ================================================================================ */
window.__screens = ['loadout', 'offers', 'encounter', 'payout', 'end'];

const app = document.getElementById('app');
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') node.className = attrs[k];
    else if (k === 'text') node.textContent = attrs[k];
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === null || attrs[k] === undefined) continue;
    else node.setAttribute(k, attrs[k]);
  }
  for (const c of (children || [])) if (c) node.appendChild(c);
  return node;
}

function portrait(id, size) {
  const src = ART[id];
  const s = size || 44;
  // Sized inline rather than by the .contact ancestor's CSS, so a portrait can be dropped
  // anywhere on screen (not only inside a roster tile) at whatever size the spot allows.
  const style = `width:${s}px;height:${s}px;border-radius:4px;border:1px solid var(--line);object-fit:cover;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:9px;flex:none;`;
  if (src) return el('img', { src, alt: id, class: 'portrait', style });
  return el('div', { class: 'portrait-fallback', text: id.slice(0, 3).toUpperCase(), style });
}

function resourceBar(view) {
  const p = view.pressure, r = view.resources;
  return el('div', { class: 'panel col' }, [
    el('div', { class: 'stat-row' }, [
      el('span', { text: 'layer' }), el('b', { text: `${view.layer + 1} / ${view.layerCount}` })
    ]),
    el('div', { class: 'stat-row' }, [
      el('span', { text: 'ram' }), el('b', { text: `${r.ram} / ${r.ramMax}` })
    ]),
    el('div', { class: 'stat-row' }, [
      el('span', { text: 'credits' }), el('b', { text: String(r.credits) })
    ]),
    el('div', { class: 'stat-row' }, [
      el('span', { text: 'roster' }), el('b', { text: `${r.roster.length} / ${r.rosterCap}` })
    ]),
    el('div', {}, [
      el('div', { class: 'meter pressure' }, [
        el('i', { style: `width:${Math.min(100, p.value / p.max * 100)}%` })
      ]),
      el('div', { class: 'meter-label' }, [
        el('span', { text: `trace — ${p.id}` }),
        el('span', { text: `${p.value} / ${p.max}` })
      ])
    ])
  ]);
}

// What a call from `id` is worth right now, in text. Against an armoured target the raw power
// isn't the number the decision turns on — the mitigated figure is — so once a threat's armour
// is known, that's what gets shown; the raw number stays visible for context.
function damageText(id, armour) {
  const power = NullrunOracle.POWER[id];
  // No unit words: this has to fit on a 58px card without truncating, which "X dmg vs armour Y"
  // does not, so the "dmg"/"ram" labels are said once, in the panel headings, and the numbers on
  // the card are left to read against them. The raw power stays visible next to the mitigated
  // figure when armoured, so "why is this contact worth less here" is still answerable on sight.
  if (armour) return `${Math.max(1, power - armour)}/${power}`;
  return `${power}`;
}

function rosterGrid(view, onCall, armour) {
  const r = view.resources;
  const grid = el('div', { class: 'roster-grid' });
  for (const id of r.roster) {
    const wrap = el('div', { class: 'contact' });
    if (onCall) {
      const canCall = r.ram >= 1;
      const btn = el('button', {
        disabled: canCall ? null : 'true',
        onclick: () => onCall(id)
      }, [
        portrait(id, 32),
        el('span', { class: 'btn-title', text: id }),
        el('span', { class: 'btn-meta stat', text: `${damageText(id, armour)} · ${NullrunOracle.CALL_COST}r` })
      ]);
      if (!canCall) btn.setAttribute('disabled', 'true');
      wrap.appendChild(btn);
    } else {
      wrap.appendChild(portrait(id, 32));
      wrap.appendChild(el('span', { text: id }));
      wrap.appendChild(el('span', { class: 'stat', text: damageText(id, armour) }));
    }
    grid.appendChild(wrap);
  }
  for (const id of r.burned) {
    const wrap = el('div', { class: 'contact burned' });
    wrap.appendChild(portrait(id, 44));
    wrap.appendChild(el('span', { text: id }));
    grid.appendChild(wrap);
  }
  return grid;
}

function screenLoadout(view, act) {
  return el('div', { class: 'screen' }, [
    el('h1', { text: 'NULLRUN' }),
    el('p', { text: 'A team is called. The arcology waits below. Every name here answers once.' }),
    el('div', { class: 'panel' }, [
      el('h2', { text: 'roster (dmg)' }),
      rosterGrid(view, null)
    ]),
    el('button', { class: 'primary', onclick: () => act({ type: 'onward' }) }, [
      el('span', { class: 'btn-title', text: 'descend' })
    ])
  ]);
}

function screenOffers(view, act) {
  const offers = view.__offers || [];
  const list = el('div', { class: 'col' });
  for (const o of offers) {
    const affordable = o.cost <= view.resources.credits;
    const btn = el('button', {
      disabled: affordable ? null : 'true',
      onclick: () => act({ type: 'take', id: o.id })
    }, [
      el('span', { class: 'btn-title', text: o.label }),
      el('span', { class: 'btn-meta', text: `reach ${o.reach} · cost ${o.cost}cr` }),
      el('span', { class: 'btn-meta ' + (o.achievable ? 'reached' : 'unreached'),
        text: o.achievable ? 'clearable now' : 'not clearable now' })
    ]);
    if (!affordable) btn.setAttribute('disabled', 'true');
    list.appendChild(btn);
  }
  return el('div', { class: 'screen' }, [
    el('h1', { text: `layer ${view.layer + 1}` }),
    resourceBar(view),
    el('div', { class: 'panel' }, [
      el('h2', { text: 'targets' }),
      list
    ]),
    el('div', { class: 'panel' }, [
      el('h2', { text: 'roster (dmg)' }),
      rosterGrid(view, null)
    ])
  ]);
}

function screenEncounter(view, act) {
  const t = view.threat, inc = view.incoming, free = view.free;
  return el('div', { class: 'screen' }, [
    el('h1', { text: `layer ${view.layer + 1} · turn ${view.turn + 1}` }),
    resourceBar(view),
    el('div', { class: 'panel' }, [
      el('h2', { text: 'target' }),
      t ? el('div', {}, [
        el('div', { class: 'meter threat' }, [
          el('i', { style: `width:${Math.min(100, Math.max(0, t.integrity / Math.max(1, t.integrity) * 100))}%` })
        ]),
        el('div', { class: 'stat-row' }, [
          el('span', { style: 'display:flex;align-items:center;gap:6px;' }, [
            portrait(t.id, 20), el('span', { text: t.id })
          ]),
          el('b', { text: `integrity ${t.integrity} · armour ${t.armour}` })
        ])
      ]) : el('p', { text: 'no target' })
    ]),
    el('div', { class: 'panel' }, [
      el('h2', { text: 'incoming this turn' }),
      el('p', {}, [
        el('span', { class: 'tag warn', text: `${inc ? inc.value : 0} ${inc ? inc.label : ''} on end turn` })
      ])
    ]),
    el('div', { class: 'panel' }, [
      el('h2', { text: 'roster — call one (dmg · ram cost)' }),
      rosterGrid(view, (id) => act({ type: 'call', id }), t ? t.armour : 0)
    ]),
    el('div', { class: 'col' }, [
      el('button', {
        disabled: view.__freeUsed ? 'true' : null,
        onclick: () => act({ type: 'free' })
      }, [
        el('span', { class: 'btn-title', text: `free — ${free ? free.id : ''}` }),
        el('span', { class: 'btn-meta', text: `${free ? free.value : 0} dmg, once per turn` })
      ]),
      el('button', { onclick: () => act({ type: 'end' }) }, [
        el('span', { class: 'btn-title', text: 'end turn' })
      ]),
      el('button', { onclick: () => act({ type: 'bail' }) }, [
        el('span', { class: 'btn-title', text: 'bail' })
      ])
    ])
  ]);
}

function screenPayout(view, act) {
  return el('div', { class: 'screen' }, [
    el('h1', { text: 'target cleared' }),
    resourceBar(view),
    el('div', { class: 'panel' }, [
      el('h2', { text: 'roster (dmg)' }),
      rosterGrid(view, null)
    ]),
    el('button', { class: 'primary', onclick: () => act({ type: 'onward' }) }, [
      el('span', { class: 'btn-title', text: 'continue' })
    ])
  ]);
}

function screenEnd(view) {
  return el('div', { class: 'screen' }, [
    el('h1', { text: 'NULLRUN' }),
    el('div', { class: 'panel' }, [
      el('div', { class: `end-banner ${view.outcome}`, text: view.outcome === 'win' ? 'core reached' : 'traced' }),
      el('p', { text: view.outcome === 'win'
        ? `Layer ${view.layerCount} cleared. Run complete.`
        : `Run ended at layer ${view.layer + 1}.` })
    ])
  ]);
}

function render(view, act) {
  app.innerHTML = '';
  act = act || function () {};
  let node;
  if (view.screen === 'loadout') node = screenLoadout(view, act);
  else if (view.screen === 'offers') node = screenOffers(view, act);
  else if (view.screen === 'encounter') node = screenEncounter(view, act);
  else if (view.screen === 'payout') node = screenPayout(view, act);
  else node = screenEnd(view, act);
  app.appendChild(node);
}

window.__render = function (view) { render(view, null); };

/* ================================================================================
 * Standalone play: only runs when nothing else has already called __render (the
 * check harness always drives __render itself before this fires). Keeps its own
 * state via the oracle copy above and re-renders through the same render() used by
 * the test hook, wiring offer/threat metadata the bare View doesn't carry (achievable
 * flags, free-used-this-turn) via the local __offers/__freeUsed hints.
 * ================================================================================ */
(function boot() {
  if (window.__NULLRUN_NO_AUTOSTART__) return;
  let state = NullrunOracle.newRun(Date.now() % 1000000);

  function currentView() {
    const v = NullrunOracle.view(state);
    v.__offers = NullrunOracle.allOffers(state);
    v.__freeUsed = state.freeUsedThisTurn;
    return v;
  }

  function act(action) {
    const legal = NullrunOracle.legalActions(state);
    const ok = legal.some(a => a.type === action.type && (a.id ?? null) === (action.id ?? null));
    if (!ok) return;
    state = NullrunOracle.apply(state, action);
    render(currentView(), act);
  }

  render(currentView(), act);
})();
</script>
</body>
</html>
